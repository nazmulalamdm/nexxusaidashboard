version: "3.8"

services:
  nexus-ai-dashboard:
    container_name: nexus_ai_dashboard
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3000" # পোর্ট কনফ্লিক্ট এড়াতে হোস্টে ৩০০১ (প্রয়োজনে ৩০০০ করতে পারেন)
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', (r) => {if (r.statusCode >= 400) process.exit(1)})\";"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge